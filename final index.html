<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loadout // find your gear. chosen by pros.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #040405;
            --panel-bg: rgba(12, 12, 15, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.25);
            --text-main: #f3f3f5;
            --text-dim: #71717a;
            --text-muted: #4a4a52;
            --font-head: 'Space Grotesk', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        /* CUSTOM SLICK SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-black);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-head);
            user-select: none;
            -webkit-font-smoothing: antialiased;
            text-transform: lowercase;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 30px 24px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1;
        }

        .brand-title svg {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .sub-tag {
            color: var(--text-dim);
            font-size: 0.85rem;
            font-family: var(--font-code);
        }

        .header-meta {
            text-align: right;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* CATEGORY SWITCHER & GOLD GLOWING TAB */
        .category-switcher {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-code);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .cat-btn:hover {
            color: var(--text-main);
            border-color: var(--border-hover);
        }

        .cat-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .cat-btn.gold-glow {
            border: 1px solid #fbbf24;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.06);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.25);
            animation: goldPulse 2.5s infinite alternate;
        }

        .cat-btn.gold-glow:hover, .cat-btn.gold-glow.active {
            background: #fbbf24;
            color: #040405;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
        }

        @keyframes goldPulse {
            0% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
            100% { box-shadow: 0 0 22px rgba(251, 191, 36, 0.45); }
        }

        /* NAVIGATION & SCROLLABLE COMPANY TABS */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .company-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-behavior: smooth;
        }

        .company-tab {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-code);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .company-tab svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .company-tab:hover {
            color: var(--text-main);
            border-color: var(--border-hover);
        }

        .company-tab.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: #ffffff;
        }

        .search-box {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            font-family: var(--font-code);
            backdrop-filter: blur(12px);
        }

        .search-box:focus {
            border-color: var(--border-hover);
        }

        /* SIDE-BY-SIDE COMPARISON ARENA */
        .compare-section {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 35px;
            backdrop-filter: blur(16px);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .compare-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .compare-selectors { grid-template-columns: 1fr; }
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: var(--font-code);
        }

        select {
            background: #000000;
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            font-family: var(--font-code);
            cursor: pointer;
        }

        select:focus {
            border-color: var(--border-hover);
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .compare-grid { grid-template-columns: 1fr; }
        }

        .compare-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .compare-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .verdict-box {
            grid-column: span 2;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 16px;
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: #e2e8f0;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .verdict-box { grid-column: span 1; }
        }

        .pro-list, .con-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-family: var(--font-code);
            font-size: 0.78rem;
        }

        .pro-list li::before { content: "+ "; color: #a3e635; font-weight: bold; }
        .con-list li::before { content: "- "; color: #f87171; font-weight: bold; }

        /* PROS CHOICE VIEW STYLES */
        .pro-choice-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .pro-section-header {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            font-family: var(--font-code);
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .pro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .pro-card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .pro-card:hover {
            transform: translateY(-4px);
        }

        .pro-image-container {
            width: 100%;
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pro-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .pro-card:hover .pro-image-container img {
            transform: scale(1.03);
        }

        .pro-profile {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .pro-info-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            font-family: var(--font-code);
        }

        .pro-info-realname {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: var(--font-code);
        }

        /* COMPANY HEADER DISPLAY */
        .company-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .company-logo-container {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .company-logo-container svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .company-heading-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* CATALOG GRID */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 18px;
        }

        .gear-card {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .gear-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .gear-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .spec-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-code);
            font-size: 0.78rem;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
        }

        .spec-key {
            color: var(--text-dim);
        }

        .spec-val {
            color: #ffffff;
            text-align: right;
            max-width: 60%;
        }

        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* SIMPLE AUDIO PLAYER WIDGET */
        .mini-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-code);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .mini-player-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: var(--font-code);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: lowercase;
        }

        .mini-player-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .mini-player-info {
            font-size: 0.75rem;
            color: var(--text-dim);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <div class="brand-block">
                <div class="brand-title">
                    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8">
                        <rect x="20" y="20" width="60" height="60" rx="10"/>
                        <path d="M 50 20 L 50 50" />
                        <circle cx="50" cy="65" r="5" fill="currentColor"/>
                    </svg>
                    loadout
                </div>
                <div class="sub-tag">find your gear. chosen by pros.</div>
            </div>
            <div class="header-meta">
                database v4.5 // pro telemetry index<br>
                hardware spec analyzer
            </div>
        </header>

        <!-- CATEGORY SWITCHER -->
        <div class="category-switcher">
            <button class="cat-btn active" id="btnMice" onclick="switchCategory('mice')">gaming mice</button>
            <button class="cat-btn" id="btnKeyboards" onclick="switchCategory('keyboards')">gaming keyboards</button>
            <button class="cat-btn" id="btnMousepads" onclick="switchCategory('mousepads')">gaming mousepads</button>
            <button class="cat-btn gold-glow" id="btnPros" onclick="switchCategory('pros')">pros choice</button>
        </div>

        <!-- DYNAMIC COMPARISON OR SEARCH/FILTER SECTION -->
        <div id="dynamicTopSection">
            <div class="compare-section" id="compareSectionBox">
                <div class="section-title">
                    <span>head-to-head spec comparison arena</span>
                    <span style="font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-code);">pros, cons & telemetry verdict</span>
                </div>
                <div class="compare-selectors">
                    <div class="select-group">
                        <label>select item a</label>
                        <select id="compareA" onchange="runComparison()"></select>
                    </div>
                    <div class="select-group">
                        <label>select item b</label>
                        <select id="compareB" onchange="runComparison()"></select>
                    </div>
                </div>
                <div class="compare-grid" id="compareResultGrid"></div>
            </div>

            <div class="filter-section" id="filterSectionBox">
                <input type="text" id="searchInput" class="search-box" placeholder="search any model, sensor, switch, or surface..." oninput="filterCatalog()">
                <div class="company-tabs" id="companyTabs"></div>
            </div>
        </div>

        <div id="catalogContainer"></div>

        <footer>
            <span>loadout // find your gear. chosen by pros.</span>
            <span>precision hardware telemetry</span>
        </footer>
    </div>

    <!-- SIMPLE BOTTOM-RIGHT AUDIO PLAYER -->
    <div class="mini-player">
        <button class="mini-player-btn" id="audioToggleBtn" onclick="toggleAudio()">play</button>
        <div class="mini-player-info" id="audioStatusText">audio stream: paused</div>
        <!-- Embedded audio using the provided track source -->
        <audio id="bgAudio" loop>
